output_path = "/scratch/ksidorov/gourd-experiments/lifting/output"
metrics_path = "/scratch/ksidorov/gourd-experiments/lifting/metrics"
experiments_folder = "/scratch/ksidorov/gourd-experiments/lifting/synthetic"

[input.rcpsp-max]
arguments = [
    "-n", "param|n",
    "max",
    "path|/home/ksidorov/disjoint-data/nontrivial/rcpsp-max/*/*.dzn"
    # "path|/home/ksidorov/disjoint-data/nontrivial/rcpsp-max/sm_j30_converted/PSP64.dzn"
]

[input.rcpsp]
arguments = [
    "-n", "param|n",
    "std",
    "path|/home/ksidorov/disjoint-data/nontrivial/rcpsp/*/*.dzn"
    # "path|/home/ksidorov/disjoint-data/nontrivial/rcpsp/data_pack_d/pack003.dzn"
]

[program.pumpkin-lb]
binary = "/home/ksidorov/cumulative-lifting/main.py"
arguments = [
    "--solver", "pumpkin",
    "--solver-flags", "--optimisation-strategy linear-unsat-sat",
    "-t", "3600000"
    # "-t", "60000"
]

[program.pumpkin-ub]
binary = "/home/ksidorov/cumulative-lifting/main.py"
arguments = [
    "--solver", "pumpkin",
    "-t", "3600000"
    # "-t", "60000"
]

[program.cp-sat-ub]
binary = "/home/ksidorov/cumulative-lifting/main.py"
arguments = [
    "--solver", "cp-sat",
    "-t", "3600000"
    # "-t", "60000"
]

[parameter.n]
values = ["0", "5"]

[slurm]
experiment_name = "lift"
output_folder = "./slurmout/"
partition = "compute-p2"
account = "research-eemcs-st"

[resource_limits]
time_limit = "1h 5m"
cpus = 1
mem_per_cpu = 4000
