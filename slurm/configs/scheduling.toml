# CP 2026 main experiment: the effect of lifting on RCPSP and RCPSP/max, rerun for the corrigendum.
# Ported from gourd/scheduling.toml (removed in v0.3.0; see commit ecc8a50).
#
# Every main.py flag lives under [program.main]: scut keeps only arguments[0] (the flavor) and the
# path| glob from [input.*] and appends `flavor path` to the command, so the input-side flags of
# the gourd config (-n, -p, -b, -l, --lifting-solver) moved here. The arms are two table factors
# (named levels, each a list of tokens that replaces `${solver}` / `${lifting}` in the command), so
# a run dir reads main/solver=<solver>+lifting=<arm>/<input>/<instance>.
#
# Levels of [factors.lifting], per level of [factors.solver]:
#   base      : -n 0, no lifting (identical under both lifting behaviors, so it runs once)
#   lift      : -n 5, the corrected lifting (default since v0.3.0)
#   lift-cp26 : -n 5 --cp26-lifting-behavior, reproduces the lifting behind the main-text results of
#               the CP 2026 paper (commit 4125e99: the legacy representative, no early stop)
#
# Solver flags are copied verbatim from the gourd config that produced the paper's results, with
# one exception: Pumpkin primal passes `--solver-flags=-f` as a single token, since argparse rejects
# a bare `-f` as the value of a separate token (gourd's `"\"-f\""` relied on its own quoting).
#
# The glob is a placeholder so that a pilot is the very same config over fewer instances. Run
# names are relative to the fixed prefix of the glob, i.e. to the data directory, so pilot and
# full-campaign runs of an instance share the same relative path -- as long as the pattern
# starts with a wildcard, since a literal leading directory would become part of the prefix:
#   full: -Dglob='**/*.dzn'
#   pilot: a narrower pattern, e.g. -Dglob='**/*1.dzn' (~9% of RCPSP and RCPSP/max, but no data_la_x)
#
# Build, inspect and submit with:
#   scut build slurm/configs/scheduling.toml -Dworkspace=... -Dproject_dir=... -Drcpsp=... -Drcpsp_max=... \
#       -Dpumpkin_repo=... -Dpumpkin_commit=<the paper's Pumpkin commit> -Dcpsat_binary=.../bin/fzn-cp-sat -Dglob='**/*.dzn' -v
#   scut plan      # one fully resolved argv, before spending an array on it
#   scut submit    # re-runnable: drains as much of the backlog as the quota allows
#   scut nodes     # after completion: which node ran each task
#   report/export.py ${workspace}/experiments/latest -o runs.csv -b bounds.csv

experiment_root = "${workspace}/experiments"

[input.rcpsp-max]
arguments = ["max", "path|${rcpsp_max}/${glob}"]

[input.rcpsp]
arguments = ["std", "path|${rcpsp}/${glob}"]

# --- dependencies ---------------------------------------------------------------------------------
# What the commands run without naming it: main.py reaches the solvers through minizinc's registry.
# scut fingerprints these at build and refuses to submit once any of them changes, so that a
# campaign cannot drift onto another solver build (as Pumpkin did between the paper and the
# corrigendum). The `command` probes run on the machine that builds and submits, with its PATH, so
# that PATH should be the one the compute nodes get.

[dependency.lifting]
git = "${project_dir}"    # main.py, its modules, and uv.lock (incl. gurobipy) via `uv run --frozen`

[dependency.pumpkin]
git = "${pumpkin_repo}"                                 # the source, which must be at...
expect = "${pumpkin_commit}"                            # ...the Pumpkin version of the paper
file = "${pumpkin_repo}/target/release/pumpkin-solver"  # the binary its .msc points to

[dependency.cp-sat]
file = "${cpsat_binary}"  # fzn-cp-sat, from the OR-Tools distribution

[dependency.minizinc]
command = ["minizinc", "--version"]

[dependency.minizinc-solvers]
command = ["minizinc", "--solvers-json"]  # which build `--solver pumpkin` / `cp-sat` resolves to

# --- arms -----------------------------------------------------------------------------------------
# solver x lifting, lifting varying fastest: the three lifting arms of one solver configuration are
# adjacent in the array, so they share a submission and a node pool.

[factors.solver]
pumpkin-lb = ["--solver", "pumpkin", "--solver-flags", "-f --optimisation-strategy linear-unsat-sat"]
pumpkin-ub = ["--solver", "pumpkin", "--solver-flags=-f"]
cp-sat-lb  = ["--solver", "cp-sat", "--solver-flags", "-v --params \"optimize_with_core:true use_strong_propagation_in_disjunctive:true use_overload_checker_in_cumulative:true\""]
cp-sat-ub  = ["--solver", "cp-sat", "--solver-flags", "-f --params \"use_strong_propagation_in_disjunctive:true use_overload_checker_in_cumulative:true\""]

[factors.lifting]
base      = ["-n", "0"]
lift      = ["-n", "5"]
lift-cp26 = ["-n", "5", "--cp26-lifting-behavior"]

[program.main]
command = [
    "${project_dir}/main.py",
    "--lifting-solver", "gurobi",
    "${lifting}",
    "-p", "100",
    "-b", "1000",
    "${solver}",
    "-t", "3600000",
]
output_envs = true

[slurm]
experiment_name = "schedule"
partition = "compute-p2"
account = "research-eemcs-st"

[resource_limits]
time_limit_minutes = 65
cpus = 1
mem_per_cpu = 4000
