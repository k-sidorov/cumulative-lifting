[project]
name = "cumulative-lifting"
version = "0.1.0"
description = "Cumulative lifting preprocessing for RCPSPs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cpmpy>=0.9.28",
    "loguru>=0.7.3",
    "minizinc>=0.10.0",
    "scipy>=1.17.0",
    "setuptools==80.0.0",
]

[project.optional-dependencies]
milp-solvers = [
    "gurobipy>=13.0.1",
    "pyscipopt>=6.0.0",
]
